[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"

# Pinned versions (see TOOLS.md). wasm-* crates track wasm-tools 1.259.0.
[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
oxc_allocator = "0.151.0"
oxc_ast = "0.151.0"
oxc_parser = "0.151.0"
oxc_semantic = "0.151.0"
oxc_span = "0.151.0"
oxc_syntax = "0.151.0"
oxc_diagnostics = "0.151.0"
wasm-encoder = "0.259.0"
wasmparser = "0.259.0"
wit-parser = "0.259.0"
wit-component = "0.259.0"

js2wasi3-frontend = { path = "crates/frontend" }
js2wasi3-ir = { path = "crates/ir" }
js2wasi3-lower = { path = "crates/lower" }
js2wasi3-backend = { path = "crates/backend" }
js2wasi3-component = { path = "crates/component" }
