<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notes &amp; Todo</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#1d2433;--muted:#667085;--line:#e4e8f0;--accent:#4f46e5;--accent-2:#7c3aed;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;
--shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);--r:14px;
--yellow:#fff4c2;--green:#d9f5e0;--blue:#dbeafe;--pink:#fde0ec;--purple:#ebe0fd;--gray:#eceff3}
:root[data-theme=dark]{--bg:#0f1420;--card:#171d2d;--text:#e8ecf5;--muted:#93a0b8;--line:#263049;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
--yellow:#4a4220;--green:#1d3b2a;--blue:#1d3357;--pink:#4a2236;--purple:#342757;--gray:#2a3244}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;display:flex;gap:.75rem;align-items:center;padding:.7rem 1.2rem;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:#fff;font-weight:700}
h1{font-size:1.05rem;margin:0}.sub{color:var(--muted);font-size:.8rem}
.grow{flex:1}.search{position:relative;max-width:360px;width:100%}.search input{width:100%;padding:.5rem .8rem .5rem 2rem;border:1px solid var(--line);border-radius:999px;background:var(--bg)}
.search::before{content:"⌕";position:absolute;left:.75rem;top:.35rem;color:var(--muted);font-size:1.1rem}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 .35rem;font-size:.75rem;color:var(--muted)}
.badge{font-size:.72rem;padding:.2rem .6rem;border-radius:999px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;white-space:nowrap}
.icon{border:1px solid var(--line);background:var(--card);border-radius:10px;width:36px;height:36px;cursor:pointer}
main{max-width:1100px;margin:0 auto;padding:1.2rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem;margin-bottom:1.2rem}
.stat{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:.9rem 1rem}.stat b{display:block;font-size:1.6rem;line-height:1.1}.stat span{color:var(--muted);font-size:.8rem}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:.5rem}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#34d399);transition:width .4s}
.cols{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:1.2rem}@media(max-width:820px){.cols{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:1rem 1.1rem}.card h2{font-size:1rem;margin:0 0 .8rem;display:flex;align-items:center;gap:.5rem}
.row{display:flex;gap:.5rem;flex-wrap:wrap}.row>input[type=text]{flex:1;min-width:140px}
input[type=text],input[type=date],select,textarea{padding:.5rem .65rem;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{border:0;border-radius:10px;padding:.5rem .95rem;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-weight:600}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:500}
.chips{display:flex;gap:.4rem;margin:.9rem 0 .4rem;align-items:center}.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:.2rem .7rem;cursor:pointer;color:var(--muted);font-size:.85rem}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
ul{list-style:none;margin:0;padding:0}.todo{display:flex;align-items:center;gap:.6rem;padding:.55rem .3rem;border-bottom:1px solid var(--line)}.todo:last-child{border:0}
.todo input[type=checkbox]{width:19px;height:19px;accent-color:var(--ok);cursor:pointer}
.todo .t{flex:1;min-width:0;overflow-wrap:anywhere}.todo.done .t{text-decoration:line-through;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}.dot.high{background:var(--bad)}.dot.normal{background:var(--warn)}.dot.low{background:var(--ok)}
.due{font-size:.75rem;padding:.1rem .5rem;border-radius:99px;background:var(--bg);color:var(--muted)}.due.late{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:1rem;border-radius:8px;padding:.1rem .4rem}.x:hover{background:var(--bg);color:var(--bad)}
.empty{text-align:center;color:var(--muted);padding:1.6rem .5rem}.empty big{display:block;font-size:2rem}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.8rem}
.note{border-radius:12px;padding:.8rem .9rem;position:relative;min-height:110px;box-shadow:0 1px 2px rgba(0,0,0,.08);display:flex;flex-direction:column;gap:.3rem}
.note h3{margin:0;font-size:.95rem;padding-right:3.2rem}.note p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.9rem}.note small{margin-top:auto;color:var(--muted);font-size:.72rem}
.note .tools{position:absolute;top:.35rem;right:.35rem;display:flex;opacity:.35;transition:opacity .15s}.note:hover .tools,.note:focus-within .tools{opacity:1}
.note.pinned::after{content:"";position:absolute;left:.7rem;top:-4px;width:26px;height:6px;border-radius:3px;background:var(--accent)}
.yellow{background:var(--yellow)}.green{background:var(--green)}.blue{background:var(--blue)}.pink{background:var(--pink)}.purple{background:var(--purple)}.gray{background:var(--gray)}
dialog{border:0;border-radius:var(--r);padding:1.2rem;width:min(460px,92vw);background:var(--card);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.35)}dialog::backdrop{background:rgba(10,15,30,.5)}
dialog form{display:grid;gap:.7rem}dialog textarea{min-height:120px;resize:vertical}.swatches{display:flex;gap:.5rem}
.swatches label{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;display:inline-block}.swatches input{display:none}.swatches input:checked+label{border-color:var(--accent)}
#toasts{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);display:grid;gap:.5rem;z-index:20}
.toast{background:#1d2433;color:#fff;border-radius:12px;padding:.6rem .9rem;box-shadow:0 8px 24px rgba(0,0,0,.3);display:flex;gap:.8rem;align-items:center;animation:in .2s}.toast button{background:none;border:0;color:#a5b4fc;cursor:pointer;font-weight:600}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:1.2rem}
</style>
<header>
  <div class="logo">✓</div>
  <div><h1>Notes &amp; Todo</h1><div class="sub">Express 5 · one WebAssembly component</div></div>
  <div class="grow"></div>
  <div class="search"><input id="q" type="search" placeholder="Search…  ( / )" aria-label="Search"></div>
  <span class="badge" id="runtime">…</span>
  <button class="icon" id="theme" title="Dark / light" aria-label="Toggle theme">☾</button>
</header>
<main>
  <section class="stats" aria-label="Summary">
    <div class="stat"><b id="s-open">0</b><span>open todos</span><div class="bar"><i id="bar" style="width:0"></i></div></div>
    <div class="stat"><b id="s-done">0</b><span>done</span></div>
    <div class="stat"><b id="s-notes">0</b><span>notes</span></div>
    <div class="stat"><b id="s-req">0</b><span>requests served · <span id="s-up">0s</span> up</span></div>
  </section>
  <div class="cols">
    <section class="card" aria-labelledby="th">
      <h2 id="th">☑ Todos</h2>
      <form id="tf" class="row">
        <input type="text" id="tt" placeholder="What needs doing?" maxlength="200" required aria-label="New todo">
        <select id="tp" aria-label="Priority"><option value="low">low</option><option value="normal" selected>normal</option><option value="high">high</option></select>
        <input type="date" id="td" aria-label="Due date">
        <button class="btn">Add</button>
      </form>
      <div class="chips" role="group" aria-label="Filter">
        <button class="chip" data-f="" aria-pressed="true">All</button><button class="chip" data-f="open" aria-pressed="false">Open</button><button class="chip" data-f="done" aria-pressed="false">Done</button>
        <span class="grow"></span><button class="chip" id="clear">Clear done</button>
      </div>
      <ul id="tl"></ul>
    </section>
    <section class="card" aria-labelledby="nh">
      <h2 id="nh">✎ Notes <span class="grow"></span><button class="btn" id="new-note">+ New note</button></h2>
      <div class="notes" id="nl"></div>
    </section>
  </div>
</main>
<footer>Data is saved by the server in <code>data/db.json</code>. <kbd>/</kbd> search · <kbd>t</kbd> todo · <kbd>n</kbd> note</footer>

<dialog id="dlg"><form method="dialog" id="nf">
  <h2 style="margin:0">New note</h2>
  <input type="text" id="nt" placeholder="Title (optional)" maxlength="100">
  <textarea id="nx" placeholder="Write something…" maxlength="2000" required></textarea>
  <div class="swatches" id="sw"></div>
  <div class="row" style="justify-content:flex-end"><button class="btn ghost" value="cancel" formnovalidate>Cancel</button><button class="btn" value="ok">Save note</button></div>
</form></dialog>
<div id="toasts" aria-live="polite"></div>

<script>
const $ = (id) => document.getElementById(id);
const api = (m, u, b) => fetch(u, { method: m, headers: { "content-type": "application/json" }, body: b && JSON.stringify(b) })
  .then((r) => (r.status === 204 ? null : r.json()));
const COLORS = ["yellow", "green", "blue", "pink", "purple", "gray"];
let filter = "", query = "", color = "yellow";

// theme
const root = document.documentElement;
function setTheme(t) { root.dataset.theme = t; $("theme").textContent = t === "dark" ? "☀" : "☾"; try { localStorage.theme = t; } catch {} }
setTheme((() => { try { return localStorage.theme; } catch {} })() || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
$("theme").onclick = () => setTheme(root.dataset.theme === "dark" ? "light" : "dark");

function toast(msg, undo) {
  const t = document.createElement("div"); t.className = "toast"; t.append(msg);
  if (undo) { const b = document.createElement("button"); b.textContent = "Undo"; b.onclick = () => { t.remove(); undo(); }; t.append(b); }
  $("toasts").append(t); setTimeout(() => t.remove(), 5000);
}
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
const today = () => new Date().toISOString().slice(0, 10);

async function load() {
  const qs = (extra) => { const p = new URLSearchParams(extra); if (query) p.set("q", query); return p.toString(); };
  const [todos, notes, s] = await Promise.all([api("GET", "/api/todos?" + qs(filter ? { filter } : {})), api("GET", "/api/notes?" + qs({})), api("GET", "/api/stats")]);
  $("runtime").textContent = s.runtime;
  $("s-open").textContent = s.open; $("s-done").textContent = s.done; $("s-notes").textContent = s.notes; $("s-req").textContent = s.requests;
  $("s-up").textContent = s.uptime < 90 ? s.uptime + "s" : Math.round(s.uptime / 60) + "m";
  $("bar").style.width = (s.todos ? Math.round(100 * s.done / s.todos) : 0) + "%";

  const tl = $("tl"); tl.replaceChildren();
  if (!todos.length) { const e = el("li", "empty"); e.append(el("big", "", "🎉"), query || filter ? "Nothing matches." : "All clear. Add your first todo above."); tl.append(e); }
  for (const t of todos) {
    const li = el("li", "todo" + (t.done ? " done" : ""));
    const c = el("input"); c.type = "checkbox"; c.checked = t.done; c.setAttribute("aria-label", "Done: " + t.title);
    c.onchange = async () => { await api("PATCH", "/api/todos/" + t.id, { done: c.checked }); load(); };
    const dot = el("span", "dot " + t.priority); dot.title = t.priority + " priority";
    li.append(c, dot, el("span", "t", t.title));
    if (t.due) li.append(el("span", "due" + (!t.done && t.due < today() ? " late" : ""), t.due));
    const x = el("button", "x", "✕"); x.title = "Delete"; x.onclick = async () => {
      await api("DELETE", "/api/todos/" + t.id); load();
      toast("Todo deleted", async () => { const n = await api("POST", "/api/todos", { title: t.title, priority: t.priority, due: t.due }); if (t.done) await api("PATCH", "/api/todos/" + n.id, { done: true }); load(); });
    };
    li.append(x); tl.append(li);
  }

  const nl = $("nl"); nl.replaceChildren();
  if (!notes.length) { const e = el("div", "empty"); e.style.gridColumn = "1/-1"; e.append(el("big", "", "📝"), query ? "Nothing matches." : "No notes yet. Press n to write one."); nl.append(e); }
  for (const n of notes) {
    const d = el("article", "note " + n.color + (n.pinned ? " pinned" : ""));
    d.append(el("h3", "", n.title || "Untitled"), el("p", "", n.text), el("small", "", new Date(n.created).toLocaleString()));
    const tools = el("div", "tools");
    const pin = el("button", "x", n.pinned ? "📌" : "📍"); pin.title = n.pinned ? "Unpin" : "Pin"; pin.onclick = async () => { await api("PATCH", "/api/notes/" + n.id, { pinned: !n.pinned }); load(); };
    const col = el("button", "x", "🎨"); col.title = "Change colour"; col.onclick = async () => { await api("PATCH", "/api/notes/" + n.id, { color: COLORS[(COLORS.indexOf(n.color) + 1) % COLORS.length] }); load(); };
    const del = el("button", "x", "✕"); del.title = "Delete"; del.onclick = async () => {
      await api("DELETE", "/api/notes/" + n.id); load();
      toast("Note deleted", async () => { await api("POST", "/api/notes", { title: n.title, text: n.text, color: n.color, pinned: n.pinned }); load(); });
    };
    tools.append(pin, col, del); d.append(tools); nl.append(d);
  }
}

$("tf").onsubmit = async (e) => { e.preventDefault(); await api("POST", "/api/todos", { title: $("tt").value, priority: $("tp").value, due: $("td").value }); $("tt").value = ""; $("td").value = ""; load(); };
document.querySelectorAll(".chip[data-f]").forEach((b) => b.onclick = () => {
  filter = b.dataset.f; document.querySelectorAll(".chip[data-f]").forEach((x) => x.setAttribute("aria-pressed", x === b)); load();
});
$("clear").onclick = async () => { const r = await api("DELETE", "/api/todos?done=1"); toast(r.removed + " finished todo(s) cleared"); load(); };
let timer; $("q").oninput = (e) => { clearTimeout(timer); timer = setTimeout(() => { query = e.target.value.trim(); load(); }, 150); };

// note dialog
const sw = $("sw");
COLORS.forEach((c, i) => { const r = el("input"); r.type = "radio"; r.name = "color"; r.id = "c-" + c; r.checked = i === 0; r.onchange = () => (color = c);
  const l = el("label", c); l.htmlFor = r.id; l.title = c; sw.append(r, l); });
$("new-note").onclick = () => { $("nf").reset(); color = "yellow"; $("dlg").showModal(); $("nx").focus(); };
$("nf").onsubmit = async (e) => { if (e.submitter && e.submitter.value === "ok") { await api("POST", "/api/notes", { title: $("nt").value, text: $("nx").value, color }); load(); toast("Note saved"); } };

addEventListener("keydown", (e) => {
  if (e.target.matches("input,textarea,select") || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "/") { e.preventDefault(); $("q").focus(); } else if (e.key === "t") { e.preventDefault(); $("tt").focus(); } else if (e.key === "n") { e.preventDefault(); $("new-note").click(); }
});
load(); setInterval(() => { if (!document.hidden && !$("dlg").open && document.activeElement.tagName !== "INPUT") load(); }, 5000);
</script>
